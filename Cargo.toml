[package]
name = "gitlogs-tui"
version = "0.1.0"
edition = "2024"
description = "Outils git pour le terminal : gitlog (graphe interactif), gitchange (modifications non commitées), gitmerge (conflits sur trois colonnes)"

# Le tronc commun est la bibliothèque ; chaque outil de la suite est un binaire.
[[bin]]
name = "gitlog"
path = "src/bin/gitlog.rs"

[[bin]]
name = "gitchange"
path = "src/bin/gitchange.rs"

[[bin]]
name = "gitmerge"
path = "src/bin/gitmerge.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.7", default-features = false }
ratatui = "0.30"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[profile.release]
strip = true
